<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a> </li>
        </ul>
    </nav>
    <form id="contact_form" method="POST" action="https://webhook.site/b7fcd064-2287-46af-a710-460a53dee30a"></form>

    <p>
        <label for="fullname"> Full Name</label>
        <input type="text" name="fullname" id="fullname" required>
    </p>

    <p>
        <label for="email"> Email Address</label>
        <input type="text" name="email" id="email" required>
    </p>

    <p>
        <label for="customer_reference"> Customer Reference </label>
        <input type="text" name="customer_reference" id="customer_reference" required>
    </p>

    <p>
        <label for="reply_required"> reply_required </label>
        <input type="checkbox" name="reply_required" id="reply_required" required>
    </p>

    <p>
        <label for="priority"> Priority </label>
        <select name="priority" id="priority">
            <option value="0">Low</option>
            <option value="1">Normal</option>
            <option value="2">High</option>
        </select>
    </p>

    <p>
        <label for="message">Message:</label>
        <textarea name="message" id="message" required></textarea>
    </p>
    <p>
        <input type="submit" value="Send" id="submit">
    </p>
    <script src="contact.js"></script>
</body>

</html>
